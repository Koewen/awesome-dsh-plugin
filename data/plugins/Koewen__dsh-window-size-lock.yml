url: https://github.com/Koewen/dsh-window-size-lock
name: Koewen/dsh-window-size-lock
category: wsl
description:
  en: "Restores the DeepSeek Harness main window to its last user-set size on each launch, re-asserts it against the default 1280x820 layout for a short grace period, and saves stable manual resizes as the new lock."
  zh: "记住 DeepSeek Harness 主窗口尺寸：启动时恢复上次调整的大小，并在宽限期内反复断言以压过默认 1280x820 布局；手动调整窗口后自动保存为新锁定。"
